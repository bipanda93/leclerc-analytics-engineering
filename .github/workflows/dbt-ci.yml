name: dbt CI

on:
  pull_request:
    branches:
      - main

jobs:
  dbt-parse:
    runs-on: ubuntu-latest

    # dbt parse ne se connecte jamais à Snowflake :
    # le profil a seulement besoin que chaque env_var ait une valeur.
    env:
      SNOWFLAKE_ACCOUNT: dummy
      SNOWFLAKE_DBT_USER: dummy
      SNOWFLAKE_DBT_PASSWORD: dummy
      SNOWFLAKE_ROLE: dummy
      SNOWFLAKE_WAREHOUSE: dummy
      SNOWFLAKE_DATABASE: dummy

    defaults:
      run:
        working-directory: dbt/leclerc_dbt

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer dbt
        run: pip install "dbt-snowflake~=1.12.0"

      - name: Valider le projet dbt (sans connexion)
        run: dbt parse --target ci --profiles-dir ci

      # Étapes désactivées depuis la fin de l'essai Snowflake (20/10/2026).
      # Avec un compte Snowflake actif, remettre les secrets dans env
      # et réactiver ces deux étapes :
      #
      # - name: Vérifier la connexion
      #   run: dbt debug --target ci --profiles-dir ci
      #
      # - name: Construire et tester
      #   run: dbt build --target ci --profiles-dir ci